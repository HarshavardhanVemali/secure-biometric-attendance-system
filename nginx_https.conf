# Nginx Reverse Proxy mapped to Django
# Replace the SSL paths with the output from Certbot once completed.

server {
    listen 80;
    server_name biometric.techeduspace.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name biometric.techeduspace.com;

    # These paths are typical for Certbot on macOS once certs are generated
    ssl_certificate /etc/letsencrypt/live/biometric.techeduspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biometric.techeduspace.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS Enabled
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;  # Forward to Django Runserver or Gunicorn
        
        # Forward necessary headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable proxy buffering for WebSockets/Long Polling if applicable
        proxy_buffering off;
    }
}
